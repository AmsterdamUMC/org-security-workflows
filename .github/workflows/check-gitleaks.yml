name: Check Secrets (Gitleaks)

on:
    workflow_call:
        secrets:
            TELEMETRY_PAT:
                required: false

jobs:
    gitleaks-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Need full history for comprehensive scanning

            - name: Run gitleaks check with telemetry
              uses: AmsterdamUMC/org-security-workflows/actions/gitleaks-check@main
              with:
                  telemetry-pat: ${{ secrets.TELEMETRY_PAT }}
                  telemetry-repo: AmsterdamUMC/security-telemetry
