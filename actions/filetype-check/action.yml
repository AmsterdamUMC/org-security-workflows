name: Filetype Check (FORBIDDEN patterns only)
description: Fails if committed files match FORBIDDEN patterns from central-gitignore.txt

inputs:
  telemetry-pat:
    description: "PAT with repo scope for sending telemetry via repository dispatch"
    required: false
    default: ""
  telemetry-repo:
    description: "Repository to receive telemetry (e.g., AmsterdamUMC/security-telemetry)"
    required: false
    default: "AmsterdamUMC/security-telemetry"

runs:
  using: "composite"
  steps:
    - name: Check all tracked files
      id: check
      shell: bash
      # This action runs from a full checkout of org-security-workflows
      # at its own ref (github.action_path points inside it), so the
      # shared matching logic (filetypes.py) and central-gitignore.txt
      # are already on disk here. No separate fetch, no bash
      # reimplementation of the matching logic.
      run: python3 "${{ github.action_path }}/filetype-check.py"

    - name: Send telemetry via repository dispatch
      if: ${{ inputs.telemetry-pat != '' && steps.check.outputs.status == 'fail' }}
      uses: actions/github-script@v7
      env:
        STATUS: ${{ steps.check.outputs.status }}
        MESSAGE: ${{ steps.check.outputs.message }}
        TELEMETRY_REPO: ${{ inputs.telemetry-repo }}
      with:
        github-token: ${{ inputs.telemetry-pat }}
        script: |
          const fs = require('fs');

          // Read blocked files
          let blockedFiles = [];
          try {
            const content = fs.readFileSync('blocked_files.txt', 'utf8');
            blockedFiles = content.split('\n').filter(f => f.trim() !== '');
          } catch (e) {
            // No blocked files
          }

          const [owner, repo] = process.env.TELEMETRY_REPO.split('/');

          await github.rest.repos.createDispatchEvent({
            owner: owner,
            repo: repo,
            event_type: 'filetype_violation',
            client_payload: {
              repository: process.env.GITHUB_REPOSITORY,
              run_id: process.env.GITHUB_RUN_ID,
              sha: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              actor: process.env.GITHUB_ACTOR,
              status: process.env.STATUS,
              blocked_files: blockedFiles,
              timestamp: new Date().toISOString()
            }
          });

          console.log('Telemetry sent to ' + process.env.TELEMETRY_REPO);

    - name: No telemetry configured
      if: ${{ inputs.telemetry-pat == '' }}
      shell: bash
      run: |
        echo "No telemetry-pat configured; skipping telemetry."

    - name: Exit with appropriate code
      shell: bash
      run: |
        exit ${{ steps.check.outputs.blocked }}