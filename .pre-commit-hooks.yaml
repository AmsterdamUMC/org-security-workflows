# language: script (not language: python) means pre-commit executes
# the file directly via its shebang rather than managing an isolated
# interpreter. Python must be on the researcher's PATH. See the
# maintenance guide, "Shared Detection Modules", for why.
- id: check-forbidden-filetypes
  name: Check for forbidden file types
  description: Block data files that may contain sensitive information
  entry: hooks/filetype-check/check-filetypes-precommit.py
  language: script
  types: [file]
  pass_filenames: true

- id: check-personal-info
  name: Check for personal information
  description: Detect Dutch names, addresses, and email addresses
  entry: hooks/personal-info-check/check-personal-info-precommit.py
  language: script
  types: [text]
  pass_filenames: true

- id: check-forbidden-filetypes-prepush
  name: Check forbidden file types (pre-push)
  entry: hooks/filetype-check/check-filetypes-prepush.py
  language: script
  stages: [pre-push]
  always_run: true
  pass_filenames: false

- id: check-personal-info-prepush
  name: Check for personal information before push
  entry: hooks/personal-info-check/check-personal-info-prepush.py
  language: script
  stages: [pre-push]
  always_run: true
  pass_filenames: false
